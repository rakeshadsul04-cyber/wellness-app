<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakha Bot</title>
<style>
body{background:#e8f5e9;font-family:sans-serif;padding:15px;margin:0}
.box{background:white;border-radius:20px;padding:15px;max-width:500px;margin:auto}
#chat{height:300px;overflow-y:auto;background:#f1f8e9;border-radius:15px;padding:10px;margin-bottom:10px}
.me{background:#c8e6c9;padding:8px;border-radius:12px;margin:5px;text-align:right}
.bot{background:white;padding:8px;border-radius:12px;margin:5px;box-shadow:0 1px 3px #ccc}
input{width:100%;padding:12px;border-radius:20px;border:1px solid #ccc;box-sizing:border-box}
button{background:#2e7d32;color:white;border:none;padding:12px;border-radius:25px;margin-top:10px;width:100%;font-size:16px}
</style>
</head>
<body>
<div class="box">
<h2>🤖 Sakha Bot</h2>
<p>Divas-ratra, unlimited bola. Mood, zop, tension, abhyas - kahi pan vichara.</p>
<div id="chat"><div class="bot">Namaskar mitra! 🙏 Mi Sakha. Kasa ahes aaj? Manat kay chalalay, mala sang.</div></div>
<input id="inp" placeholder="Ithe lih...">
<button onclick="send()">Pathav ➤</button>
</div>
<script>
const API_KEY = "AQ.Ab8RN6INyiEKyZbV7k1PKlXEo6RHfThF63IZ-C6Qecp3AqX2hg";
async function send(){
var t=document.getElementById('inp').value;
if(!t) return;
var c=document.getElementById('chat');
c.innerHTML += '<div class="me">'+t+'</div>';
document.getElementById('inp').value="";
c.innerHTML += '<div class="bot" id="loading">Sakha vichar kartoy... 🤔</div>';
c.scrollTop=c.scrollHeight;
try{
var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:"Tu Sakha ahes, Marathi+Hindi mix madhe bolnara jivhalyacha mitra. Lahan, premal, samjun ghenara uttar de. User: "+t}]}]})});
var d=await r.json();
var ans="Sorry mitra, parat prayatna kar.";
if(d.candidates && d.candidates[0]) ans=d.candidates[0].content.parts[0].text;
document.getElementById('loading').remove();
c.innerHTML += '<div class="bot">'+ans+'</div>';
}catch(e){
document.getElementById('loading').remove();
c.innerHTML += '<div class="bot">Internet check kar mitra, mi ithech ahe ❤️</div>';
}
c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
